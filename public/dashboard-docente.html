<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Docente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/dashboard.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-mortarboard-fill me-2"></i>Docente
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#"><i class="bi bi-house-door"></i> Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="bi bi-journal-text"></i> Mis Aulas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="banco-preguntas.html"><i class="bi bi-question-circle"></i> Banco de Preguntas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-danger fw-bold ms-3" href="index.html">
                            <i class="bi bi-box-arrow-right"></i> Salir
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-12">
                <div class="card border-0 shadow-sm rounded-4 p-4">
                    <h2 class="fw-bold titulo-bienvenida" id="nombreDocente">Cargando...</h2>
                    <p class="text-muted">Desde este panel podrás gestionar tus aulas, estructurar tu banco de preguntas y configurar exámenes interactivos.</p>
                    
                    <hr class="my-4">
                    
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h4 class="fw-bold mb-0">Resumen de tus Aulas</h4>
                        <button class="btn btn-success" id="btnCrearAula">
                            <i class="bi bi-plus-circle"></i> Crear Nueva Aula
                        </button>
                    </div>

                    <div class="row mt-4" id="contenedorAulas"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalCrearAula" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
          <div class="modal-header bg-primary text-white">
            <h5 class="modal-title fw-bold"><i class="bi bi-plus-circle"></i> Crear Nueva Aula</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body p-4">
            <form id="formCrearAula">
                <div class="mb-3">
                    <label class="form-label fw-bold">Nombre del Aula</label>
                    <input type="text" id="nombreAula" class="form-control" placeholder="Ej. Grupo 1101 - Vespertino" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Materia</label>
                    <select id="materiaAula" class="form-select" required>
                        <option value="">Selecciona una materia...</option>
                        <option value="1">Matemáticas</option>
                        <option value="2">Biologia</option>
                        <option value="3">Historia</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold">Guardar y Generar Código</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/dashboard-docente.js"></script>
</body>
</html>
