<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resolver Examen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/examen.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard-alumno.html">
                <i class="bi bi-arrow-left me-2"></i>Volver
            </a>
            <span class="navbar-text text-white fw-bold" id="tituloExamenNav">Examen</span>
            <span class="navbar-text" id="timerDisplay">
                <i class="bi bi-clock me-1"></i><span id="tiempoRestante">--:--</span>
            </span>
        </div>
    </nav>
    <div class="container mt-4">
        <div id="contenedorPreguntas" class="row justify-content-center"></div>
        <div class="text-center mt-4" id="botoneraEnviar">
            <button class="btn btn-lg btn-success fw-bold px-5" id="btnEntregar">
                <i class="bi bi-check2-square me-2"></i>Entregar Examen
            </button>
            <p class="text-muted small mt-2" id="avisoAutocierre"></p>
        </div>
        <div id="contenedorResultados" style="display:none;"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/examen.js"></script>

</html>
