<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login ExamClass</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="/public/css/Logincss.css">
</head>
<body>

    <div class="login-card">

        <div class="icon-circle">
            <i class="bi bi-person"></i>
        </div>

        <h1 class="title">Bienvenido</h1>

        <p class="subtitle">
            Inicia sesión en ExamClass
        </p>

        <form>

            <div class="mb-4">
                <label class="form-label">
                    Usuario
                </label>

                <input type="text"
                    class="form-control"
                    placeholder="Correo electronico">
            </div>

            <div class="mb-4">
                <label class="form-label">
                    Contraseña
                </label>

                <input type="password"
                    class="form-control"
                    placeholder="Ingresa tu contraseña">
            </div>

            <button class="login-btn">
                <i class="bi bi-box-arrow-in-right"></i>
                Iniciar Sesión
            </button>

        </form>

        <div class="register-text">
            ¿No tienes cuenta?
            <a href="#">Regístrate aquí</a>
        </div>

        <hr>

        


        </div>

    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Evita que la página se recargue

            const correo = document.getElementById('correo').value;
            const password = document.getElementById('password').value;

            try {
                // Enviamos los datos a Node.js
                const response = await fetch('http://localhost:3000/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ correo, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Si todo sale bien, redireccionamos a donde Node nos diga
                    window.location.href = data.redirect;
                } else {
                    // Si hay error (ej. contraseña incorrecta), mostramos una alerta
                    alert(data.message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error al conectar con el servidor.');
            }
        });
    </script>
</body>
</html>
