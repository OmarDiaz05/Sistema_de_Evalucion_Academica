<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login ExamClass</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body{
            margin:0;
            padding:30px 15px;
            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            font-family: Arial, Helvetica, sans-serif;

            background: linear-gradient(
                135deg,
                #0d5bff,
                #1d4ed8,
                #6d28d9,
                #a100ff
            );
        }

        .login-card{
            width:100%;
            max-width:500px;

            background:#f5f5f5;
            border-radius:25px;

            padding:40px 35px;

            box-shadow:0 10px 25px rgba(0,0,0,0.15);
        }

        .icon-circle{
            width: 72px;
            height: 72px;
            background: #2563ff;
            border-radius: 50%;
            display:flex;
            justify-content:center;
            align-items:center;
            margin: auto;
            margin-bottom: 20px;
        }

        .icon-circle i{
            color:white;
            font-size: 32px;
        }

        .title{
            text-align:center;
            font-size:72px;
            font-weight:700;
            color:#0f172a;
            margin-bottom:10px;
        }

        .subtitle{
            text-align:center;
            color:#475569;
            margin-bottom:35px;
        }

        .form-label{
            font-weight:600;
            color:#1e293b;
            margin-bottom:10px;
        }

        .form-control{
            height:55px;
            border-radius:14px;
            border:1px solid #d1d5db;
            padding-left:18px;
            font-size:18px;
        }

        .form-control:focus{
            box-shadow:none;
            border-color:#2563ff;
        }

        .login-btn{
            width:100%;
            height:55px;
            border:none;
            border-radius:14px;
            background:#2563ff;
            color:white;
            font-size:22px;
            font-weight:600;
            transition:0.3s;
        }

        .login-btn:hover{
            background:#1d4ed8;
        }

        .register-text{
            text-align:center;
            margin-top:28px;
            color:#334155;
        }

        .register-text a{
            text-decoration:none;
            font-weight:600;
            color:#2563ff;
        }

        hr{
            margin:35px 0 25px;
        }

        .test-users{
            text-align:center;
            color:#475569;
            margin-bottom:15px;
        }

        .user-box{
            border-radius:10px;
            padding:12px;
            font-size:14px;
        }

        .teacher{
            background:#e0e7ff;
            color:#1e3a8a;
        }

        .student{
            background:#dcfce7;
            color:#166534;
        }

        @media(max-width:576px){

            .login-card{
                padding:30px 20px;
            }

            .title{
                font-size:48px;
            }

        }
    </style>
</head>
<body>

    <div class="login-card">

        <div class="icon-circle">
            <i class="bi bi-person"></i>
        </div>

        <h1 class="title">Bienvenido</h1>

        <p class="subtitle">
            Inicia sesión en ExamClass
        </p>

        <form>

            <div class="mb-4">
                <label class="form-label">
                    Usuario
                </label>

                <input type="text"
                    class="form-control"
                    placeholder="Ingresa tu usuario">
            </div>

            <div class="mb-4">
                <label class="form-label">
                    Contraseña
                </label>

                <input type="password"
                    class="form-control"
                    placeholder="Ingresa tu contraseña">
            </div>

            <button class="login-btn">
                <i class="bi bi-box-arrow-in-right"></i>
                Iniciar Sesión
            </button>

        </form>

        <div class="register-text">
            ¿No tienes cuenta?
            <a href="#">Regístrate aquí</a>
        </div>

        <hr>

        <div class="test-users">
            Usuarios de prueba:
        </div>


        </div>

    </div>

</body>
</html>
