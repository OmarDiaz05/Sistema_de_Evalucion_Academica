<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ExamClass</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/Login.css">
</head>
<body>

    <div class="login-card">

        <div class="icon-circle">
            <i class="bi bi-person"></i>
        </div>

        <h1 class="title">Bienvenido</h1>

        <p class="subtitle">
            Para continuar ingresa los datos de tu cuenta
        </p>

        <form id="loginForm">

            <div class="mb-4">
                <label class="form-label">
                    Correo Electrónico
                </label>
                <input type="email"
                    id="correo"
                    class="form-control"
                    placeholder="ejemplo@fes.com" required>
            </div>

            <div class="mb-4">
                <label class="form-label">
                    Contraseña
                </label>
                <div class="password-wrapper">
                    <input type="password"
                        id="password"
                        class="form-control"
                        placeholder="Ingresa tu contraseña" required>
                    <button type="button" class="password-toggle" id="togglePassword" tabindex="-1">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="login-btn">
                <i class="bi bi-box-arrow-in-right"></i>
                Iniciar Sesión
            </button>

        </form>

        <div class="register-text">
            ¿No tienes cuenta?
            <a href="registro.html">Regístrate aquí</a>
        </div>

        <hr>

        <div class="text-center text-muted small">
            <a href="index.html" class="text-decoration-none text-secondary">
                <i class="bi bi-arrow-left"></i> Volver al inicio
            </a>
        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./js/swal-config.js"></script>
    <script src="./js/login.js"></script>
</body>
</html>
