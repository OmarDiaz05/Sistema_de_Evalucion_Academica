<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Aula | ExamClass</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/aula-docente.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-white text-decoration-none" href="dashboard-docente.html">
                <i class="bi bi-arrow-left me-2"></i> Volver
            </a>
            <span class="navbar-text text-white fw-bold" id="nombreAulaHeader">
                Mi aula
            </span>
        </div>
    </nav>
    <div class="container mt-5">
        <div class="row">
            
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm border-0 rounded-4 h-100">
                    <div class="card-header bg-white border-bottom-0 pt-4 pb-2">
                        <h5 class="fw-bold text-dark"><i class="bi bi-people-fill text-primary me-2"></i>Solicitudes de Alumnos</h5>
                    </div>
                    <div class="card-body" id="contenedorSolicitudes">
                        <div class="text-center text-muted my-5">
                            <i class="bi bi-inbox display-4 mb-3 text-secondary d-block"></i>
                            <p class="fs-5">Aún no hay solicitudes de alumnos.</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm border-0 rounded-4 h-100">
                    <div class="card-header bg-white border-bottom-0 pt-4 pb-2 d-flex justify-content-between align-items-center">
                        <h5 class="fw-bold text-dark mb-0"><i class="bi bi-file-earmark-text-fill text-success me-2"></i>Exámenes</h5>
                        <button class="btn btn-sm btn-success fw-bold" id="btnCrearExamen"><i class="bi bi-plus-lg"></i> Crear Nuevo</button>
                    </div>
                    <div class="card-body" id="contenedorExamenes">
                        <div class="text-center text-muted my-5">
                            <i class="bi bi-journal-x display-4 mb-3 text-secondary"></i>
                            <p>Aún no has creado exámenes para este grupo.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Modal Crear Examen -->
    <div class="modal fade" id="modalExamen" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title fw-bold"><i class="bi bi-plus-circle"></i> Crear Nuevo Examen</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="formExamen">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Título del Examen</label>
                            <input type="text" id="tituloExamen" class="form-control" placeholder="Ej. Examen Parcial 1" required>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Fecha y Hora de Apertura</label>
                                <input type="datetime-local" id="fechaApertura" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Fecha y Hora de Cierre</label>
                                <input type="datetime-local" id="fechaCierre" class="form-control" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Tiempo Límite (minutos)</label>
                            <input type="number" id="tiempoLimite" class="form-control" placeholder="Ej. 60" min="1" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Selecciona las Preguntas</label>
                            <div id="listaPreguntas" class="p-3 bg-light rounded-3" style="max-height: 300px; overflow-y: auto;">
                                <div class="text-center text-muted">
                                    <div class="spinner-border spinner-border-sm me-2"></div>Cargando preguntas...
                                </div>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success w-100 fw-bold">
                            <i class="bi bi-check-lg"></i> Guardar Examen
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <!-- Modal Editar Examen -->
    <div class="modal fade" id="modalEditarExamen" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold"><i class="bi bi-pencil"></i> Editar Examen</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="formEditarExamen">
                        <input type="hidden" id="editExamenId">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Título del Examen</label>
                            <input type="text" id="editTituloExamen" class="form-control" required>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Fecha y Hora de Apertura</label>
                                <input type="datetime-local" id="editFechaApertura" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Fecha y Hora de Cierre</label>
                                <input type="datetime-local" id="editFechaCierre" class="form-control" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Tiempo Límite (minutos)</label>
                            <input type="number" id="editTiempoLimite" class="form-control" min="1" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Selecciona las Preguntas</label>
                            <div id="editListaPreguntas" class="p-3 bg-light rounded-3" style="max-height: 300px; overflow-y: auto;">
                                <div class="text-center text-muted">
                                    <div class="spinner-border spinner-border-sm me-2"></div>Cargando preguntas...
                                </div>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold">
                            <i class="bi bi-check-lg"></i> Guardar Cambios
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Resultados -->
    <div class="modal fade" id="modalResultados" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-info text-white">
                    <h5 class="modal-title fw-bold"><i class="bi bi-bar-chart"></i> Resultados del Examen</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <div class="text-center mb-3" id="resultadosHeader">
                        <strong id="resultadosTituloExamen"></strong>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover" id="tablaResultados">
                            <thead class="table-light">
                                <tr>
                                    <th>Alumno</th>
                                    <th>Calificación</th>
                                    <th>Fecha de Entrega</th>
                                </tr>
                            </thead>
                            <tbody id="cuerpoResultados">
                                <tr>
                                    <td colspan="3" class="text-center text-muted">Cargando resultados...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/aula-docente.js"></script>
</body>
</html>
