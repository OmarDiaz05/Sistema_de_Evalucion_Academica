<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/Login.css">
</head>
<body>
    <div class="login-card">
        <div class="icon-circle">
            <i class="bi bi-person-plus"></i>
        </div>
        <h1 class="title">Registro</h1>
        <p class="subtitle">Crea tu cuenta para empezar</p>
        <form id="registroForm">
            <div class="mb-3">
                <label class="form-label">Nombre(s)</label>
                <input type="text" id="nombre" class="form-control" required>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Apellido Paterno</label>
                    <input type="text" id="apellidoPaterno" class="form-control"  required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Apellido Materno</label>
                    <input type="text" id="apellidoMaterno" class="form-control">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Correo Electrónico</label>
                <input type="email" id="correo" class="form-control" placeholder="ejemplo@fes.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" id="password" class="form-control" minlength="6" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Tipo de Usuario</label>
                <select id="rol" class="form-control" required>
                    <option value="">Selecciona...</option>
                    <option value="alumno">Alumno</option>
                    <option value="docente">Docente</option>
                </select>
            </div>
            <div class="mb-4" id="campoMatricula" style="display:none;">
                <label class="form-label">Matrícula (docente)</label>
                <input type="text" id="matricula" class="form-control" placeholder="Ej. 123456">
            </div>
            <button type="submit" class="login-btn">
                <i class="bi bi-person-plus"></i> Crear Cuenta
            </button>
        </form>
        <div class="register-text">
            ¿Ya tienes cuenta?
            <a href="login.html">Inicia sesión aquí</a>
        </div>
        <hr>
        <div class="text-center text-muted small">
            <a href="index.html" class="text-decoration-none text-secondary">
                <i class="bi bi-arrow-left"></i> Volver al inicio
            </a>
        </div>
    </div>
   <script src="./js/registro.js"></script>
</body>
</html>
